<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Clipora — много роликов из одной съёмки">
  <meta name="theme-color" content="#0B0B10">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clipora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clipora</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B10; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.5px;
      background: linear-gradient(90deg, #8B6CFF, #FF5C9A); -webkit-background-clip: text; background-clip: text;
      color: transparent; animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .45; } }
  </style>
</head>
<body>
  <div id="splash">Clipora</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
