name: clipora
description: Clipora — много роликов из одной съёмки
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  file_picker: ^10.3.0
  web: ^1.1.0
  video_player: ^2.9.2

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-ExtraBold.otf
          weight: 800
